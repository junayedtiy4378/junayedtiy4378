name: Refresh public project overview

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-project-overview
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate public project overview
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          gh api --paginate --slurp \
            "/users/$PROFILE_USER/repos?per_page=100&type=owner" \
            > "$RUNNER_TEMP/profile-repos.json"
          {
            echo '# Public projects'
            echo
            echo 'Automatically generated from public GitHub repository data. Forks are excluded.'
            echo
            echo '| Project | Primary language | Stars |'
            echo '| --- | --- | ---: |'
            jq -r '[.[][] | select(.fork == false and .private == false)]
              | sort_by(.name | ascii_downcase)
              | .[]
              | "| [\(.name)](\(.html_url)) | \(.language // "—") | \(.stargazers_count) |"' \
              "$RUNNER_TEMP/profile-repos.json"
          } > PUBLIC-PROJECTS.md

      - name: Commit changed overview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PUBLIC-PROJECTS.md
          if git diff --cached --quiet; then
            echo 'Public project data has not changed.'
          else
            git commit -m 'docs: refresh public project overview'
            git push origin HEAD
          fi
