name: Download retail project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore the project
        run: |
          python - <<'PYTHON'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path, PurePosixPath

          pieces = []
          for i in range(1, 5):
              matches = list(Path(".github").rglob(f"part-{i:02}.txt"))
              versions = {part.read_text().strip() for part in matches}
              if len(versions) != 1:
                  raise RuntimeError(f"Part {i:02} is missing or has conflicting copies.")
              pieces.append(versions.pop())

          data = base64.b64decode("".join(pieces), validate=True)
          expected = "306fbd88275858d032554216f485f048c37d1d7b8982b22d760242062e4d6e68"
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError("A data part is incomplete or changed.")

          for name, text in json.loads(lzma.decompress(data)).items():
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts:
                  raise RuntimeError("Unexpected project path.")
              if not name.startswith("retail-sales-analytics/"):
                  raise RuntimeError("Unexpected project folder.")
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          PYTHON

      - name: Install dependencies
        working-directory: retail-sales-analytics
        run: python -m pip install -r requirements.txt

      - name: Build and test the project
        working-directory: retail-sales-analytics
        run: |
          python scripts/generate_demo_data.py
          python -m unittest discover -s tests -v
          python analyze.py
          python -c "import shutil; shutil.copyfile('reports/charts/monthly_sales.png', 'docs/monthly-sales.png')"

      - name: Downloadable source project
        uses: actions/upload-artifact@v6
        with:
          name: retail-sales-analytics-source
          include-hidden-files: true
          if-no-files-found: error
          path: |
            retail-sales-analytics/
            !retail-sales-analytics/reports/**
            !retail-sales-analytics/.cache/**
            !retail-sales-analytics/**/__pycache__/**

      - name: Downloadable reports
        uses: actions/upload-artifact@v6
        with:
          name: retail-analysis-reports
          path: retail-sales-analytics/reports/
          if-no-files-found: error
