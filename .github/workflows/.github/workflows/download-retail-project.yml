name: Download retail project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore the project
        run: |
          python - <<'PYTHON'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path, PurePosixPath

          parts = [Path(f".github/retail-transfer/part-{i:02}.txt") for i in range(1, 5)]
          if any(not part.is_file() for part in parts):
              raise RuntimeError("Add all four part files under .github/retail-transfer first.")
          encoded = "".join(part.read_text().strip() for part in parts)
          data = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(data).hexdigest() != "306fbd88275858d032554216f485f048c37d1d7b8982b22d760242062e4d6e68":
              raise RuntimeError("A part file is incomplete or changed. Copy all four files again.")
          for name, text in json.loads(lzma.decompress(data)).items():
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or not name.startswith("retail-sales-analytics/"):
                  raise RuntimeError("Unexpected project path.")
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          PYTHON

      - name: Install dependencies
        working-directory: retail-sales-analytics
        run: python -m pip install -r requirements.txt

      - name: Generate the sample data
        working-directory: retail-sales-analytics
        run: python scripts/generate_demo_data.py

      - name: Test the project
        working-directory: retail-sales-analytics
        run: python -m unittest discover -s tests -v

      - name: Generate reports and the README chart
        working-directory: retail-sales-analytics
        run: |
          python analyze.py
          python -c "import shutil; shutil.copyfile('reports/charts/monthly_sales.png', 'docs/monthly-sales.png')"

      - name: Downloadable source project
        uses: actions/upload-artifact@v6
        with:
          name: retail-sales-analytics-source
          include-hidden-files: true
          if-no-files-found: error
          path: |
            retail-sales-analytics/
            !retail-sales-analytics/reports/**
            !retail-sales-analytics/.cache/**
            !retail-sales-analytics/**/__pycache__/**

      - name: Downloadable reports
        uses: actions/upload-artifact@v6
        with:
          name: retail-analysis-reports
          path: retail-sales-analytics/reports/
          if-no-files-found: error
